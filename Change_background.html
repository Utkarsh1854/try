<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>

    <script>

        function mouseOver() {

            document.body.style.backgroundColor = "lightblue";

        }

        function focusEvent() {

            document.body.style.backgroundColor = "lightgreen";

        }

    </script>

</head>

<body>

    <h1>Welcome to My Website</h1>

    <button onmouseover="mouseOver()">
        Move Mouse Here
    </button>

    <br><br>

    <input
        type="text"
        onfocus="focusEvent()"
        placeholder="Click here"
    >

</body>
</html>
