<!DOCTYPE html>
<html>
<head>
    <title>Compare Strings</title>
</head>
<body>

<h2>String Comparison</h2>

<script>
    let str1 = prompt("Enter first string:");
    let str2 = prompt("Enter second string:");

    // Compare using strict equality
    document.write(
        "Strict Equality = " + (str1 === str2) + "<br>"
    );

    // Compare ignoring case
    document.write(
        "Case Insensitive = " +
        (str1.toLowerCase() === str2.toLowerCase()) + "<br>"
    );

    // Compare length
    if (str1.length > str2.length) {
        document.write("First string is longer<br>");
    }
    else if (str1.length < str2.length) {
        document.write("Second string is longer<br>");
    }
    else {
        document.write("Both strings have equal length<br>");
    }

    // Alphabetical comparison
    let result = str1.localeCompare(str2);

    if (result < 0) {
        document.write("First string comes before second");
    }
    else if (result > 0) {
        document.write("First string comes after second");
    }
    else {
        document.write("Strings are equal in locale comparison");
    }
</script>

</body>
</html>
